; Example settings.ini for fews-mike-adapter (Brahmaputra forecast model with data assimilation).
; Relative paths are resolved against the folder of this settings.ini.
; --forecast runs every step whose section is present.

[pixml_to_dfs0]
; FEWS PI-XML forcing
pixml_file = Assam/piInputTimeSeries/forcing.xml
; DFS0 output folder
output_folder = Assam/piInputTimeSeries

[run_mike]
; MIKE+ sqlite project
sqlite_file = Assam/Brahmaputra_Jaxa_Survey.sqlite
; Used to determine simulation period
rainfall_dfs0 = Assam/piInputTimeSeries/precipitation.dfs0
temperature_dfs0 = Assam/piInputTimeSeries/temperature.dfs0
evaporation_dfs0 = Assam/piInputTimeSeries/evaporation.dfs0
; MIKE+ executable (absolute path, or relative to this file if it exists there)
mikeplus_exe = C:\Program Files (x86)\DHI\MIKE+\2025\bin\x64\DHI.MIKEPlus.EngineShell.exe
; Optional extension of forecast period
forecast_buffer_days = 0
; Optional: PI run file exported by FEWS; time0 becomes the DA time of forecast
run_info_file = Assam/piInputTimeSeries/run_info.xml
; Optional: data assimilation on/off (true/false; needs the MIKE 1D DA licence). Omit to keep the project setting
data_assimilation = true

[da_observations]
; Optional: observed water levels for data assimilation (exported by FEWS, separate from forcing)
pixml_file = Assam/piInputTimeSeries/observations.xml
; One <locationId>.dfs0 per station; point mrm_DAUpdatePara.filename to these files
output_folder = Assam/piInputTimeSeries/DA
item_name = Water Level
timestep = 1h

[states]
; Set false if you do not want state handling
enabled = true
; Folder where FEWS exports state files before the run
state_input_folder = Assam/InputStates
; Used when a Cold_* state file is found. Cold state files should have identical names but a Cold_ prefix
coldstart_date_time = 2025-09-30 08:30:00
; NAM state generated by MIKE
output_nam_state = Assam/Brahmaputra_Jaxa_Survey_m1d - Result Files/Brahmaputra_1BaseDefault_RDII.res1d
; NAM state copied here for FEWS state ingestion; {time0} = T0 (yyyyMMdd_HHmmss), FEWS reads the state time from the name
administrated_nam_state = Assam/OutputStates/nam_state_{time0}.res1d
; HD state generated by MIKE
output_hd_state = Assam/Brahmaputra_Jaxa_Survey_m1d - Result Files/Brahmaputra_1BaseDefault_Network_HD.res1d
; HD state copied here for FEWS state ingestion ({time0} as above)
administrated_hd_state = Assam/OutputStates/state_1d_{time0}.res1d

[mikenam_to_pixml]
; NAM results
res1d_file = Assam/Brahmaputra_Jaxa_Survey_m1d - Result Files/Brahmaputra_1BaseDefault_Surface_runoff.res1d
; FEWS output
output_xml = Assam/piOutputTimeSeries/simulation_nam.xml

[result_points_to_pixml]
; HD results
res1d_file = Assam/Brahmaputra_Jaxa_Survey_m1d - Result Files/Brahmaputra_1BaseDefault_Network_HD.res1d
; CSV with location_id,river,chainage, exported by FEWS (exportLocationAttributesCsvActivity)
points_file = Assam/piInputTimeSeries/mike_result_points.csv
; FEWS output
output_xml = Assam/piOutputTimeSeries/simulation_result_points.xml
quantities = WaterLevel=H.sim:m, Discharge=Q.sim:m3/s
