[pixml_to_dfs0]
; FEWS PI-XML input
pixml_file = Assam/piInputTimeSeries/forcing.xml
; DFS0 output folder
output_folder = Assam/piInputTimeSeries

[run_mike]
; MIKE+ sqlite project
sqlite_file = Assam/Test FF_2025_2025_2025.sqlite
; Used to determine simulation period
rainfall_dfs0 = Assam/piInputTimeSeries/precipitation.dfs0
temperature_dfs0 = Assam/piInputTimeSeries/temperature.dfs0
evaporation_dfs0 = Assam/piInputTimeSeries/evaporation.dfs0
; MIKE+ executable
mikeplus_exe = C:\Program Files\DHI\MIKE+\2025\bin\x64\DHI.MIKEPlus.EngineShell.exe
; Optional extension of forecast period
forecast_buffer_days = 0

[states]
; Set false if you do not want state handling
enabled = true
; Folder where FEWS exports state files before the run
state_input_folder = Assam/InputStates
; Used when a Cold_* state file is found. Please note: cold state files should have identical names but a Cold_ prefix
coldstart_date_time = 2026-06-30 00:00:00
; NAM state generated by MIKE
output_nam_state = Assam/Test_FF_2025_m1d - Result Files/Test_FF_1_1BaseDefault_RDII.res1d
; NAM state copied here for FEWS state ingestion
administrated_nam_state = Assam/OutputStates/nam_state.res1d
; HD state generated by MIKE
output_hd_state = Assam/Test_FF_2025_m1d - Result Files/Test_FF_1_1BaseDefault_Network_HD.res1d
; HD state copied here for FEWS state ingestion
administrated_hd_state = Assam/OutputStates/state_1d.res1d

[mike11_to_pixml]
; HD results
res1d_file = Assam/Test_FF_2025_m1d - Result Files/Test_FF_1_1BaseDefault_Network_HD.res1d
; FEWS output
output_xml = Assam/piOutputTimeSeries/simulation_mike11.xml

[mikenam_to_pixml]
; NAM results
res1d_file = Assam/Test_FF_2025_m1d - Result Files/Test_FF_1_1BaseDefault_Surface_runoff.res1d
; FEWS output
output_xml = Assam/piOutputTimeSeries/simulation_nam.xml